name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore MiniERP.sln

      - name: Build
        run: dotnet build MiniERP.sln --no-restore -c Release

      - name: Test
        run: dotnet test MiniERP.sln --no-build -c Release --verbosity normal

      - name: Check for pending EF Core model changes
        run: |
          dotnet tool install --global dotnet-ef --version 9.0.0
          dotnet ef migrations has-pending-model-changes --project src/MiniERP --no-build --configuration Release
